[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-search-agent-lab"
version = "0.1.0"
description = "Evaluation-first personal search and agent research lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<2.5",
]

[project.optional-dependencies]
models = ["sentence-transformers"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["packages"]
